name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install SPECTER
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . ruff

      - name: Lint
        run: ruff check specter

      - name: Compile
        run: python -m compileall -q specter

      - name: Import and CLI smoke test
        run: |
          python -c "import specter.app, specter.recon, specter.signals, specter.report"
          specter --help
